<body>
  <center>

    <h1>Contact</h1>
    
  <p>Speak your thoughts into the void...</p>

    
    <ws-widget type="contact" iid="16105">
  <form>
      <label>Name:</label>
      <input name="name" placeholder="Anonymous">
      
      <label>Email:</label>
    <input type="email" name="email" placeholder="example@email.com">
    
      <label>Message:</label>
    <textarea name="message" placeholder="Spit it out"></textarea>
<br><br>
      <button type="submit">Send</button>
  </form>
</ws-widget>
    
    </body>
